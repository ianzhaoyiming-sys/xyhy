var state = { page: 'home', category: null, product: null };

function render() {
  var app = document.getElementById('app');
  var navIcons = { home: '🏠', about: '🏢', capability: '⚙️', patent: '📜', products: '📦' };
  var navLabels = { home: '首页<br>Home', about: '公司<br>About', capability: '能力<br>Capabilities', patent: '专利<br>Patents', products: '产品<br>Products' };
  var tabs = ['home', 'about', 'capability', 'patent', 'products'];
  
  var navHtml = '<div class="fixed top-0 left-0 right-0 left-0 right-0 bg-white border-b flex" style="z-index:100;">';
  for (var i = 0; i < tabs.length; i++) {
    var tab = tabs[i];
    navHtml += '<button onclick="go(\'' + tab + '\', null, null)" class="flex-1 py-2 text-xs text-center ' + (state.page === tab ? 'text-orange-500' : 'text-gray-400') + '"><div class="text-lg">' + navIcons[tab] + '</div><div>' + navLabels[tab] + '</div></button>';
  }
  navHtml += '</div>';
  
  var content = '';
  if (state.product) content = renderProductDetail(state.product);
  else if (state.page === 'category' && state.category) content = renderCategory(state.category);
  else if (state.page === 'home') content = renderHome();
  else if (state.page === 'about') content = renderAbout();
  else if (state.page === 'capability') content = renderCapability();
  else if (state.page === 'patent') content = renderPatent();
  else if (state.page === 'products') content = renderProducts();
  
  app.innerHTML = content + navHtml;
}

function go(page, category, product) {
  state.product = product || null;
  if (category) { state.page = 'category'; state.category = category; }
  else { state.page = page; state.category = null; }
  render();
  window.scrollTo(0, 0);
}

function renderHome() {

  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><h2 class="text-lg font-semibold mb-3">关于我们/About Us</h2><div class="grid grid-cols-2 gap-3"><div class="bg-orange-50 rounded-xl p-3"><div class="text-2xl font-bold text-orange-600">50M<span class="text-sm">￥</span></div><div class="text-xs text-gray-500">注册资本<br>Registered Cap.</div></div><div class="bg-blue-50 rounded-xl p-3"><div class="text-2xl font-bold text-blue-600">90K<span class="text-sm">M²</span></div><div class="text-xs text-gray-500">厂区<br>Area</div></div><div class="bg-green-50 rounded-xl p-3"><div class="text-2xl font-bold text-green-600">100<span class="text-sm">台</span></div><div class="text-xs text-gray-500">日产量<br>Day</div></div><div class="bg-purple-50 rounded-xl p-3"><div class="text-2xl font-bold text-purple-600">20+</div><div class="text-xs text-gray-500">专利<br>Patents</div></div></div></div>';

  h += '</div><div class="bg-white rounded-2xl p-4 card-shadow"><div class="flex gap-2"><div class="bg-green-50 px-4 py-3 rounded-lg text-sm text-green-700 flex-1 text-center font-medium">ISO9001</div><div class="bg-green-50 px-4 py-3 rounded-lg text-sm text-green-700 flex-1 text-center font-medium">欧盟CE/EU CE</div></div></div>';
  h += '<div class="bg-white rounded-2xl p-4 card-shadow"><h2 class="text-lg font-semibold mb-3">工厂视频/Factory Video</h2><div class="rounded-xl overflow-hidden"><video src="xyhy-short1.mp4" controls playsinline class="w-full"></video></div></div></div>';
  return h;
}

function renderCapability() {
  var h = '<div class="p-4"><div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-2xl p-6 mb-4 text-white card-shadow"><h1 class="text-xl font-bold">核心能力/Core Capabilities</h1></div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><div class="grid grid-cols-2 gap-3"><div class="bg-orange-50 rounded-xl p-4"><div class="text-2xl font-bold text-orange-600">30K<span class="text-sm">台</span></div><div class="text-xs text-gray-500">年产/Year</div></div><div class="bg-blue-50 rounded-xl p-4"><div class="text-2xl font-bold text-blue-600">100<span class="text-sm">台</span></div><div class="text-xs text-gray-500">日产量/Day</div></div><div class="bg-green-50 rounded-xl p-4"><div class="text-2xl font-bold text-green-600">50<span class="text-sm">人</span></div><div class="text-xs text-gray-500">团队/Team</div></div><div class="bg-purple-50 rounded-xl p-4"><div class="text-2xl font-bold text-purple-600">30K<span class="text-sm">M²</span></div><div class="text-xs text-gray-500">车间/Workshop</div></div></div></div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><h2 class="text-lg font-semibold mb-3">生产设备/Production Equipment</h2>';
  var eq = ['数控激光切管机/CNC Laser Pipe Cutter', '焊接机器人/Welding Robot', '数控对孔钻/CNC Hole Drilling', '数控激光切板机/CNC Laser Plate Cutter'];
  for (var i = 0; i < eq.length; i++) { h += '<div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg mb-2"><span class="text-green-500">✓</span><span class="text-sm">' + eq[i] + '</span></div>'; }
  h += '</div><div class="bg-white rounded-2xl p-4 card-shadow"><h2 class="text-lg font-semibold mb-3">生产线/Production Lines</h2>';
  var lines = ['立柱自动化折弯焊接/Column Bending', '零部件焊接/Parts Welding', '喷涂/Spray Painting', '装配/Assembly'];
  for (var i = 0; i < lines.length; i++) { h += '<div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg mb-2"><span class="text-green-500">✓</span><span class="text-sm">' + lines[i] + '</span></div>'; }
  h += '</div></div>';
  return h;
}

function renderPatent() {
  var h = '<div class="p-4"><div class="bg-gradient-to-r from-purple-500 to-purple-600 rounded-2xl p-6 mb-4 text-white card-shadow"><h1 class="text-xl font-bold">荣誉专利/Honors & Patents</h1></div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><div class="flex gap-3 mb-4"><div class="flex-1 bg-red-50 rounded-xl p-4 text-center"><div class="text-3xl font-bold text-red-600">2</div><div class="text-xs text-gray-500">发明专利<br>Invention</div></div><div class="flex-1 bg-blue-50 rounded-xl p-4 text-center"><div class="text-3xl font-bold text-blue-600">20+</div><div class="text-xs text-gray-500">实用新型<br>Utility Model</div></div></div></div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><h2 class="text-lg font-semibold mb-3">发明专利/Invention Patents</h2><div class="p-3 bg-orange-50 rounded-xl"><div class="font-medium text-orange-800">全自动智能化汽车举升机生产线</div><div class="text-xs text-gray-500 mt-1">Auto Intelligent Lift Production Line (National Invention Patent)</div></div></div>';
  h += '<div class="bg-white rounded-2xl p-4 card-shadow"><h2 class="text-lg font-semibold mb-3">技术优势/Technical Advantages</h2>';
  var tech = [
    ['六折弯/八折弯/十折弯结构', '6/8/10 Bend Structure'],
    ['链条/倒置/倒拉油缸', 'Chain/Inverted/Pull Cylinder'],
    ['自平衡液压四油缸', '4 Cylinder Self-Balance'],
    ['手动/电控解锁系统', 'Manual/Electric Release'],
    ['多项达国际先进水平', 'International Advanced Level']
  ];
  for (var i = 0; i < tech.length; i++) {
    h += '<div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg mb-2"><span class="text-orange-500">★</span><div class="text-sm"><div>' + tech[i][0] + '</div><div class="text-gray-400 text-xs">' + tech[i][1] + '</div></div></div>';
  }
  h += '</div></div>';
  return h;

function renderProducts() {
  var h = '<div class="p-4"><div class="bg-gradient-to-r from-green-500 to-green-600 rounded-2xl p-6 mb-4 text-white card-shadow"><h1 class="text-xl font-bold">产品矩阵/Product Matrix</h1></div><div class="grid grid-cols-2 gap-3">';
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    var count = products[cat.id] ? products[cat.id].length : 0;
    var parts = cat.name.split('/');
    var cnName = parts.slice(0, parts.length-1).join('/');
    var enName = parts[parts.length-1];
    h += '<div onclick="go(\'' + cat.id + '\', \'' + cat.id + '\', null)" class="' + cat.color + ' rounded-xl p-4 text-white cursor-pointer"><div class="text-2xl mb-1">' + cat.icon + '</div><div class="font-medium">' + cnName + '</div><div class="text-xs opacity-80">' + enName + '</div><div class="text-xs opacity-80 mt-1">' + count + ' 款</div></div>';
  }
  h += '</div></div>';
  return h;
}

function renderCategory(categoryId) {
  var cat = null;
  for (var i = 0; i < categories.length; i++) { if (categories[i].id === categoryId) { cat = categories[i]; break; } }
  var prods = products[categoryId] || [];
  var catNames = { bend: '折弯系列/Bend Series', 'four-post': '四柱/停车/Four-Post & Parking', scissor: '中位剪/摩托/Scissor & Motorcycle', energy: '新能源/New Energy', 'in-ground': '地藏剪式/In-Ground Lift', ramp: '斜坡大剪/Ramp Lift', tire: '扒胎机/Tire Changer' };
  
  var h = '<div class="p-4"><div class="' + cat.color + ' rounded-2xl p-6 mb-4 text-white card-shadow"><div class="text-3xl mb-2">' + cat.icon + '</div><h1 class="text-xl font-bold">' + catNames[categoryId].split('/')[0] + '</h1><p class="text-sm opacity-90">' + catNames[categoryId].split('/')[1] + '</p><p class="text-xs opacity-80 mt-1">' + prods.length + ' 款产品 / ' + prods.length + ' Models</p></div><div class="space-y-3">';
  for (var i = 0; i < prods.length; i++) {
    var p = prods[i];
    var specKeys = Object.keys(p.specs);
    var firstSpec = p.specs[specKeys[0]];
    var imgTag = p.image ? '<img src="' + p.image + '" class="w-16 h-16 object-cover rounded-lg" />' : '<div class="w-16 h-16 bg-gray-200 rounded-lg flex items-center justify-center text-gray-400 text-xl">📷</div>';
    h += '<div onclick="showProductById(\'' + p.id + '\')" class="bg-white rounded-2xl p-4 card-shadow cursor-pointer flex gap-3"><div class="flex-shrink-0">' + imgTag + '</div><div class="flex-1"><div class="flex justify-between items-start mb-2"><div class="flex-1"><div class="text-xs text-gray-400">' + p.model + '</div><h3 class="font-semibold text-gray-800">' + p.name + '</h3><div class="text-xs text-gray-500">' + p.en + '</div></div><div class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">' + firstSpec.split('/')[0] + '</div></div><div class="flex flex-wrap gap-1 mt-2">';
    var feats = p.features.split('|');
    for (var j = 0; j < Math.min(4, feats.length); j++) {
      h += '<span class="text-xs bg-orange-50 text-orange-600 px-2 py-0.5 rounded">' + feats[j] + '</span>';
    }
    h += '</div></div></div>';
  }
  h += '</div></div>';
  return h;
}

function showProductById(id) {
  for (var catId in products) {
    var list = products[catId];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        state.product = list[i];
        render();
        return;
      }
    }
  }
}

function renderProductDetail(product) {
  var h = '<div class="p-4"><button onclick="goBack()" class="mb-4 flex items-center gap-2 text-gray-600"><span>←</span> 返回/Back</button>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><div class="text-xs text-gray-400 mb-1">' + product.model + '</div><h2 class="text-xl font-bold text-gray-800 mb-1">' + product.name + '</h2><div class="text-sm text-gray-500">' + product.en + '</div></div>';
  
  var img1Html = product.image ? '<img src="' + product.image + '" class="w-full max-h-80 object-contain rounded-xl bg-gray-50" style="max-width:100%;" />' : '<div class="bg-gray-100 rounded-xl h-48 flex items-center justify-center"><div class="text-center text-gray-400"><div class="text-4xl mb-2">📷</div><div class="text-sm">点击添加产品图片/Click to add product image</div></div></div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><div class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">图1：产品外观/Product Appearance</div>' + img1Html + '</div>';
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><div class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">图2：细节/应用场景/Details & Application</div><div class="bg-gray-100 rounded-xl h-48 flex items-center justify-center"><div class="text-center text-gray-400"><div class="text-4xl mb-2">📷</div><div class="text-sm">点击添加图片/Click to add image</div></div></div></div>';
  
  h += '<div class="bg-white rounded-2xl p-4 mb-4 card-shadow"><h3 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">基础参数/Basic Parameters</h3><div class="grid grid-cols-2 gap-2 text-sm">';
  var keys = Object.keys(product.specs);
  var keyLabels = { 额定举升:'额定举升<br>Lifting Capacity', 举升高度:'举升高度<br>Lifting Height', 整机宽度:'整机宽度<br>Width', 举升时间:'举升时间<br>Lifting Time', 电机功率:'电机功率<br>Motor Power', 重量:'重量<br>Weight', 举升重量:'举升重量<br>Lifting Capacity', 最大高度:'最大高度<br>Max Height', 整机尺寸:'整机尺寸<br>Overall Size', 毛重:'毛重<br>Gross Weight', 平台:'平台<br>Platform', 倾斜角度:'倾斜角度<br>Tilt Angle', 台面可移动:'台面可移动<br>Movable Table', 二次举升:'二次举升<br>Secondary Lift', 外夹:'外夹<br>Outer Clamp', 内夹:'内夹<br>Inner Clamp', 轮径:'轮径<br>Wheel Dia.', 轮宽:'轮宽<br>Wheel Width', 压力:'压力<br>Clamping Force', 噪声:'噪声<br>Noise', 平台间距:'平台间距<br>Platform Gap' };
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var val = product.specs[key];
    if (val) { 
      var displayVal = val.includes('/') ? val.split('/')[0] : val;
      h += '<div class="flex justify-between p-2 bg-gray-50 rounded"><span class="text-gray-500">' + (keyLabels[key]||key) + '</span><span class="text-gray-800 font-medium">' + displayVal + '</span></div>'; 
    }
  }
  h += '</div></div>';
  
  h += '<div class="bg-white rounded-2xl p-4 card-shadow"><h3 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">产品特性/Product Features</h3><div class="space-y-2">';
  var feats = product.features.split('|');
  for (var i = 0; i < feats.length; i++) {
    var featParts = feats[i].split('/');
    var featCn = featParts[0];
    var featEn = featParts[1] || '';
    h += '<div class="flex items-start gap-2 p-2 bg-gray-50 rounded"><span class="text-green-500 mt-1">✓</span><div class="text-sm text-gray-600"><div>' + featCn + '</div><div class="text-gray-400">' + featEn + '</div></div></div>';
  }
  h += '</div></div></div>';
  return h;
}

function goBack() {
  state.product = null;
  render();
}

render();
</script>
