    // 主应用
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);

      const tabs = [
        { id: 'home', label: '首页', icon: '🏠' },
        { id: 'about', label: '公司', icon: '🏢' },
        { id: 'capability', label: '能力', icon: '⚙️' },
        { id: 'patent', label: '专利', icon: '📜' },
        { id: 'products', label: '产品', icon: '📦' },
      ];

      const renderContent = () => {
        if (selectedProduct) {
          return <ProductDetailPage product={selectedProduct} onBack={() => setSelectedProduct(null)} />;
        }
        
        if (activeTab === 'category' && selectedCategory) {
          return <CategoryPage categoryId={selectedCategory} onProductClick={setSelectedProduct} />;
        }

        switch (activeTab) {
          case 'home': return <Home />;
          case 'about': return <AboutPage />;
          case 'capability': return <CapabilityPage />;
          case 'patent': return <PatentPage />;
          case 'products':
            return (
              <div className="p-4 pb-20">
                <div className="bg-gradient-to-r from-green-500 to-green-600 rounded-2xl p-6 mb-4 text-white card-shadow">
                  <h1 className="text-xl font-bold">产品矩阵</h1>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {categories.map(cat => (
                    <div 
                      key={cat.id}
                      onClick={() => { setSelectedCategory(cat.id); setActiveTab('category'); }}
                      className={`${cat.color} rounded-xl p-4 text-white cursor-pointer`}
                    >
                      <div className="text-2xl mb-1">{cat.icon}</div>
                      <div className="font-medium">{cat.name}</div>
                      <div className="text-xs opacity-80">{products[cat.id]?.length || 0} 款</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          default: return <Home />;
        }
      };

      return (
        <div className="max-w-md mx-auto bg-gray-50 min-h-screen">
          <div className="sticky top-0 bg-white z-10 bottom-nav">
            <div className="flex">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); setSelectedCategory(null); setSelectedProduct(null); }}
                  className={`flex-1 py-3 text-xs text-center ${activeTab === tab.id ? 'text-orange-500 border-b-2 border-orange-500' : 'text-gray-400'}`}
                >
                  <div className="text-lg mb-0.5">{tab.icon}</div>
                  {tab.label}
                </button>
              ))}
            </div>
          </div>
          {renderContent()}
        </div>
      );
    }

// ROUTER
let state = { page: 'home', category: null, product: null };

function render() {
  var app = document.getElementById('app');
  var navTabs = ['home', 'about', 'capability', 'patent', 'products'];
  var navIcons = { home: '🏠', about: '🏢', capability: '⚙️', patent: '📜', products: '📦' };
  var navLabels = { home: '首页', about: '公司', capability: '能力', patent: '专利', products: '产品' };
  
  var navHtml = '<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex" style="max-width:28rem;margin:0 auto">';
  for (var i = 0; i < navTabs.length; i++) {
    var tab = navTabs[i];
    navHtml += '<button onclick="go(\'' + tab + '\', null, null)" class="flex-1 py-3 text-xs text-center ' + (state.page === tab ? 'text-orange-500' : 'text-gray-400') + '"><div class="text-lg">' + navIcons[tab] + '</div>' + navLabels[tab] + '</button>';
  }
  navHtml += '</div>';
  
  var content = '';
  if (state.product) {
    content = renderProductDetail(state.product);
  } else if (state.page === 'category' && state.category) {
    content = renderCategory(state.category);
  } else if (state.page === 'home') {
    content = renderHome();
  } else if (state.page === 'about') {
    content = renderAbout();
  } else if (state.page === 'capability') {
    content = renderCapability();
  } else if (state.page === 'patent') {
    content = renderPatent();
  } else if (state.page === 'products') {
    content = renderProducts();
  }
  
  app.innerHTML = content + navHtml;
}

function go(page, category, product) {
  if (product) { state.product = product; }
  else { state.product = null; }
  
  if (category) {
    state.page = 'category';
    state.category = category;
  } else {
    state.page = page;
    state.category = null;
  }
  render();
  window.scrollTo(0, 0);
}

function renderCategory(categoryId) {

  for (var i = 0; i < prods.length; i++) {

var firstSpec = p.specs[specKeys[0]];

function goBack() {
  state.product = null;

function showProductById(id) {
  for (var catId in products) {
    var list = products[catId];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        state.product = list[i];
        render();
        return;
      }
    }
  }
}
