name: Android Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Install dependencies
        run: npm install
      
      - name: Build web assets
        run: mkdir -p dist && cp xyhy-pad-cn-en.html dist/index.html && cp xyhy-short1.mp4 dist/
      
      - name: Sync Android
        run: npx cap sync android
      
      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore android/app/xyhy-release.keystore \
            -alias xyhy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass xyhy123 -keypass xyhy123 \
            -dname "CN=XYHY, OU=Dev, O=Shanghai XYHY, L=Shanghai, ST=Shanghai, C=CN"
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk